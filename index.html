<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>Ball of Duty</title>
<style>body{margin:0;background:#0b0b0c;color:#f2efe9;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:16px;box-sizing:border-box}a{color:#ff7a1a}</style>
<script>
// Ball of Duty is verhuisd. Naam en code gaan mee, zodat niemand opnieuw hoeft in te loggen.
(function(){
  var NEW="https://rijkenk.github.io/poolteam-app/ballofduty/";
  try{
    var me=localStorage.getItem("bod-me"),auth=localStorage.getItem("bod-auth");
    if(me&&!localStorage.getItem("ballofduty-me"))localStorage.setItem("ballofduty-me",me);
    if(auth&&!localStorage.getItem("ballofduty-auth"))localStorage.setItem("ballofduty-auth",auth);
  }catch(e){}
  try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(r.scope.indexOf("/ball-of-duty/")>-1)r.unregister()})})}catch(e){}
  location.replace(NEW+location.hash);
})();
</script>
</head>
<body><p>Ball of Duty is verhuisd naar<br><a href="https://rijkenk.github.io/poolteam-app/ballofduty/">rijkenk.github.io/poolteam-app/ballofduty</a></p></body>
</html>
