name: CueScore bijwerken en opkomst controleren

on:
  schedule:
    - cron: "17 * * * *"   # elk uur
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gegevens ophalen
        run: |
          curl -sSf "https://api.cuescore.com/tournament/?id=83574433" -o /tmp/raw.json
          jq --argjson team 62677429 '{
            updated: (now | todate),
            standings: [ (.standings["1"] // [])[] | {pos: .position, name: .player.name, played, wins, ties, losses, fw: .frameWins, fl: .frameLosses, pts: .points} ],
            matches: [ .matches[] | select(.playerA.teamId == $team or .playerB.teamId == $team) |
              {no: .matchno, round, start: .starttime, home: .playerA.name, away: .playerB.name, venue: (.playerA.venue.name // ""), sa: .scoreA, sb: .scoreB, status: .matchstatus, url} ]
          }' /tmp/raw.json > /tmp/new.json
          test "$(jq '.matches | length' /tmp/new.json)" -gt 0
      - name: Opslaan als er iets veranderd is
        run: |
          if [ -f data/cuescore.json ] && diff -q <(jq 'del(.updated)' data/cuescore.json) <(jq 'del(.updated)' /tmp/new.json) >/dev/null; then
            echo "Geen wijzigingen"; exit 0
          fi
          mkdir -p data && cp /tmp/new.json data/cuescore.json
          git config user.name "cuescore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cuescore.json
          git commit -m "CueScore-gegevens bijgewerkt"
          git push
      - name: Opkomst controleren (72 uur voor de wedstrijd)
        env:
          CAPTAIN_PHONE: ${{ secrets.CAPTAIN_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          git pull --quiet origin main || true
          node scripts/check-opkomst.mjs
          if [ -n "$(git status --porcelain data/meldingen.json)" ]; then
            git config user.name "cuescore-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/meldingen.json
            git commit -m "Opkomst gecontroleerd"
            git push
          fi
