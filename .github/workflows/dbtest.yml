name: Databasetest (tijdelijk)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: REST-test
        run: |
          K=sb_publishable_PGowq3YpHdObHB5V0h12FQ__OKs2RAt; U=https://itccbxepuevwwsxdriqy.supabase.co
          echo "== opgaves apikey"; curl -sS "$U/rest/v1/opgaves?select=*" -H "apikey: $K" -w " [%{http_code}]\n"
          echo "== opgaves bearer"; curl -sS "$U/rest/v1/opgaves?select=*" -H "apikey: $K" -H "Authorization: Bearer $K" -w " [%{http_code}]\n"
          echo "== opstelling"; curl -sS "$U/rest/v1/opstelling?select=*" -H "apikey: $K" -w " [%{http_code}]\n"
          echo "== check_code fout"; curl -sS -X POST "$U/rest/v1/rpc/check_code" -H "apikey: $K" -H "Content-Type: application/json" -d '{"p_code":"fout"}' -w " [%{http_code}]\n"
          echo "== check_admin fout"; curl -sS -X POST "$U/rest/v1/rpc/check_admin" -H "apikey: $K" -H "Content-Type: application/json" -d '{"p_code":"fout"}' -w " [%{http_code}]\n"
          echo "== set_opgave fout"; curl -sS -X POST "$U/rest/v1/rpc/set_opgave" -H "apikey: $K" -H "Content-Type: application/json" -d '{"p_code":"fout","p_match":1,"p_player":"x","p_status":"ja","p_prefs":[]}' -w " [%{http_code}]\n"
          echo "== team_secret (moet leeg/geweigerd)"; curl -sS "$U/rest/v1/team_secret?select=*" -H "apikey: $K" -w " [%{http_code}]\n"
          echo "== direct insert (moet geweigerd)"; curl -sS -X POST "$U/rest/v1/opgaves" -H "apikey: $K" -H "Content-Type: application/json" -d '{"match":1,"player":"x","status":"ja"}' -w " [%{http_code}]\n"
          echo "== cdn"; for v in 2.45.4 2.57.4; do curl -sS -o /dev/null -w "$v %{http_code}\n" https://cdn.jsdelivr.net/npm/@supabase/supabase-js@$v/dist/umd/supabase.js; done
          echo "== cuescore CORS"; curl -sS -o /dev/null -D - -H "Origin: https://rijkenk.github.io" "https://api.cuescore.com/tournament/?id=83574433" | grep -i -E "^HTTP|access-control" || true
      - name: supabase-js test
        run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i -s @supabase/supabase-js@2.45.4 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { createClient } from "@supabase/supabase-js";
          const sb=createClient("https://itccbxepuevwwsxdriqy.supabase.co","sb_publishable_PGowq3YpHdObHB5V0h12FQ__OKs2RAt",{auth:{persistSession:false}});
          console.log("select", JSON.stringify(await sb.from("opgaves").select("*")));
          console.log("rpc", JSON.stringify(await sb.rpc("check_code",{p_code:"fout"})));
          JS
          node t.mjs
